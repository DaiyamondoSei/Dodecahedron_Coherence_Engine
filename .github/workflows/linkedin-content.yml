# Quannex LinkedIn Content Generator
# Generates draft posts on Monday (philosophy) and Wednesday (features)
# Creates a GitHub issue with the draft - you get notified, copy to LinkedIn

name: LinkedIn Content Generator

on:
  schedule:
    # Monday 8:00 AM UTC (adjust for your timezone)
    - cron: '0 8 * * 1'
    # Wednesday 8:00 AM UTC
    - cron: '0 8 * * 3'
  workflow_dispatch:
    inputs:
      post_type:
        description: 'Post type'
        required: true
        default: 'philosophy'
        type: choice
        options:
          - philosophy
          - feature

jobs:
  generate-content:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 20  # Get recent history for commits

      - name: Determine post type
        id: post-type
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "type=${{ github.event.inputs.post_type }}" >> $GITHUB_OUTPUT
          else
            DAY=$(date +%u)
            if [ "$DAY" = "1" ]; then
              echo "type=philosophy" >> $GITHUB_OUTPUT
            else
              echo "type=feature" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Get recent POC activity
        id: poc-activity
        run: |
          echo "=== Recent Commits ===" > poc_context.txt
          git log --oneline -10 >> poc_context.txt
          echo "" >> poc_context.txt
          echo "=== Changed Files (last 10 commits) ===" >> poc_context.txt
          git diff --name-only HEAD~10 2>/dev/null >> poc_context.txt || echo "No changes" >> poc_context.txt
          echo "" >> poc_context.txt
          echo "=== Key File Snippets ===" >> poc_context.txt

          # Add context from key files
          if [ -f "js/main.js" ]; then
            echo "--- main.js (first 50 lines) ---" >> poc_context.txt
            head -50 js/main.js >> poc_context.txt 2>/dev/null || true
          fi

          cat poc_context.txt

      - name: Generate LinkedIn draft with Claude
        id: generate
        uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Generate a LinkedIn post for Quannex.

            POST TYPE: ${{ steps.post-type.outputs.type }}

            CONTEXT - Recent POC development:
            $(cat poc_context.txt)

            GUIDELINES:
            - Tone: Thoughtful, authentic, sharing a journey (not marketing)
            - Length: 150-300 words
            - This is Deimantas sharing his bachelor thesis journey
            - Quannex = Sacred Geometry Organizational Coherence Engine
            - Uses dodecahedron (12 faces = 12 org domains)
            - Uses breath axes (6 balanced flows)
            - Uses phi ratio (golden ratio for coherence)

            IF PHILOSOPHY POST:
            - Explore one concept deeply (dodecahedron, breath, coherence, phi)
            - Share WHY it matters, not just what
            - End with a reflective question

            IF FEATURE POST:
            - Focus on ONE recent code change or discovery
            - Show the journey, including challenges
            - Keep it human and relatable

            OUTPUT: Just the LinkedIn post text, ready to copy-paste.
            Include 3-5 relevant hashtags at the end.

      - name: Create draft issue
        uses: actions/github-script@v7
        with:
          script: |
            const postType = '${{ steps.post-type.outputs.type }}';
            const date = new Date().toISOString().split('T')[0];
            const title = `[LinkedIn Draft] ${postType.charAt(0).toUpperCase() + postType.slice(1)} - ${date}`;

            const body = `## LinkedIn Draft Ready for Review

            **Type:** ${postType}
            **Generated:** ${new Date().toISOString()}

            ---

            ### Post Content

            ${{ steps.generate.outputs.result }}

            ---

            ### Instructions

            1. Review and edit the content above
            2. Copy the post text
            3. Open [LinkedIn](https://www.linkedin.com) and create a new post
            4. Paste and add an image (dodecahedron screenshot or Quannex logo)
            5. Post!
            6. Close this issue when done

            ---
            *Generated by Quannex LinkedIn Content System*
            `;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['linkedin-draft']
            });

      - name: Summary
        run: |
          echo "## LinkedIn Draft Generated!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "A new issue has been created with your draft." >> $GITHUB_STEP_SUMMARY
          echo "Check your GitHub notifications!" >> $GITHUB_STEP_SUMMARY
