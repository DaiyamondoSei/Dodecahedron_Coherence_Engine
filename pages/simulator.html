<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coherence Simulator - Quannex</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="../css/simulator/sim-main.css">
</head>
<body>
    <!-- ════════════════════════════════════════════════════════════════════════
         COHERENCE SIMULATOR - Full Vision
         ════════════════════════════════════════════════════════════════════════
         Interactive what-if analysis tool for organizational coherence.
         All 12 dodecahedron faces. 6 breath axes. Live 3D feedback.

         Created: February 2026
         Architecture: Modular (js/simulator/*.js + css/simulator/*.css)
         ════════════════════════════════════════════════════════════════════════ -->

    <div class="sim-container">

        <!-- ═══════════════ HEADER ═══════════════ -->
        <header class="sim-header">
            <h1 class="sim-title">COHERENCE SIMULATOR</h1>
            <p class="sim-subtitle">Interactive What-If Analysis</p>
        </header>

        <!-- ═══════════════ STATUS BAR ═══════════════ -->
        <div class="sim-status-bar">
            <div class="sim-status-item">
                <span class="sim-status-label">Company</span>
                <span class="sim-status-value" id="sim-current-company">Loading...</span>
                <span id="sim-company-container"></span>
            </div>
            <div class="sim-status-item">
                <span class="sim-status-label">Baseline</span>
                <span class="sim-status-value" id="sim-baseline-coherence">--</span>
            </div>
            <div class="sim-status-item">
                <span class="sim-status-label">Engine</span>
                <span class="sim-status-value warning" id="sim-engine-status">Initializing...</span>
            </div>
        </div>

        <!-- ═══════════════ MAIN CONTENT ═══════════════ -->
        <div class="sim-main-grid">

            <!-- LEFT: Face Energy Controls (12 sliders in 6 axis pairs) -->
            <div class="sim-controls-area" role="region" aria-label="Face energy controls">
                <!-- Populated by sim-controls.js -->
            </div>

            <!-- RIGHT: Analysis Panels -->
            <div class="sim-panels-area" role="region" aria-label="Analysis panels">

                <!-- Impact Summary -->
                <div class="sim-panel sim-panel--accent sim-impact-panel" id="sim-impact-panel">
                    <div class="sim-impact-title">Coherence Impact</div>
                    <div class="sim-impact-metric">
                        <span class="sim-impact-label">Global Coherence</span>
                        <span class="sim-impact-value neutral" id="sim-impact-global">--</span>
                    </div>
                    <div class="sim-impact-metric">
                        <span class="sim-impact-label">Being/Doing Balance</span>
                        <span class="sim-impact-value neutral" id="sim-impact-balance">--</span>
                    </div>
                    <div class="sim-impact-metric">
                        <span class="sim-impact-label">Shadow Alert</span>
                        <span class="sim-impact-value neutral" id="sim-impact-shadow">--</span>
                    </div>
                </div>

                <!-- Breath Axis Balance -->
                <div class="sim-panel sim-breath-panel" id="sim-breath-panel">
                    <!-- Populated by sim-breath.js -->
                </div>

                <!-- Shadow Detection -->
                <div class="sim-panel sim-shadow-panel" id="sim-shadow-panel">
                    <!-- Populated by sim-shadow.js -->
                </div>

            </div>
        </div>

        <!-- ═══════════════ SCENARIOS ═══════════════ -->
        <div class="sim-scenarios-area" role="region" aria-label="Saved scenarios">
            <!-- Populated by sim-scenarios.js -->
        </div>

    </div>

    <!-- ════════════════════════════════════════════════════════════════════════
         SCRIPT LOAD ORDER (CRITICAL)
         ════════════════════════════════════════════════════════════════════════
         1. Logger utility (all modules log through this)
         2. Constants (phi-harmonics, kpi-constants - SSOT for faces/axes)
         3. Engine dependencies (breath-analyzer, spectral-analyzer, main.js)
         4. Simulator modules in dependency order
         5. ES Module bootstrap (bridges UnifiedDataLoader and starts init)
         ════════════════════════════════════════════════════════════════════════ -->

    <!-- Logger -->
    <script src="../js/utils/logger.js"></script>

    <!-- Constants (SimState reads AXIS_OPPOSITIONS and DOMAIN_NAMES) -->
    <script src="../js/constants/phi-harmonics.js"></script>
    <script src="../js/constants/kpi-constants.js"></script>

    <!-- Engine Dependencies -->
    <script src="../js/breath-analyzer.js"></script>
    <script src="../js/spectral-analyzer.js"></script>
    <script type="module" src="../js/main.js"></script>

    <!-- Simulator Modules (dependency order) -->
    <script src="../js/simulator/sim-state.js"></script>
    <script src="../js/simulator/sim-company.js"></script>
    <script src="../js/simulator/sim-controls.js"></script>
    <script src="../js/simulator/sim-engine.js"></script>
    <script src="../js/simulator/sim-breath.js"></script>
    <script src="../js/simulator/sim-shadow.js"></script>
    <script src="../js/simulator/sim-sync.js"></script>
    <script src="../js/simulator/sim-scenarios.js"></script>
    <script src="../js/simulator/sim-main.js"></script>

    <!-- ES Module Bootstrap: Bridge UnifiedDataLoader and start initialization -->
    <script type="module">
        import { UnifiedDataLoader } from '../js/unified-data-loader.js';

        // Bridge ES module into IIFE world
        window.SimEngine.setLoader(new UnifiedDataLoader());

        // Start the full initialization chain
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => window.SimMain.start());
        } else {
            window.SimMain.start();
        }
    </script>
</body>
</html>
