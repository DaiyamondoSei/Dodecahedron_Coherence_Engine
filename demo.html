<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quannex Dodecahedron Engine Demo</title>
    <link rel="icon" href="data:,"><!-- Suppress favicon 404 -->
    <link rel="stylesheet" href="css/sprint2-theme.css">
    <link rel="stylesheet" href="css/demo.css">
</head>

<body>
    <!-- Main Container Frame -->
    <iframe id="main-frame" src="demo-orchestrator.html"></iframe>

    <!-- Loading indicator shown during iframe navigation -->
    <div id="frame-loading" class="frame-loading">
        <div class="q-spinner"></div>
    </div>

    <!-- Load Logger Utility -->
    <script src="js/utils/logger.js"></script>
    <!-- UX: Toast & Error Recovery -->
    <script src="js/ux/toast-notifications.js"></script>
    <script src="js/ux/error-recovery.js"></script>

    <script>
        const mainFrame = document.getElementById('main-frame');
        const frameLoading = document.getElementById('frame-loading');
        const allowedOrigin = window.location.origin;

        // Show loading indicator when iframe src changes
        function showFrameLoading() {
            frameLoading.classList.add('visible');
        }
        function hideFrameLoading() {
            frameLoading.classList.remove('visible');
        }

        mainFrame.addEventListener('load', hideFrameLoading);

        // Listen for view change requests from the orchestrator
        window.addEventListener('message', (event) => {
            // Validate origin for security
            if (event.origin !== allowedOrigin) {
                Logger.warn('Demo', `Rejected postMessage from untrusted origin: ${event.origin}`);
                return;
            }

            const { type, view } = event.data;

            if (type === 'SWITCH_VIEW') {
                Logger.info('Demo', `Switching to view: ${view}`);

                showFrameLoading();

                if (view === 'orchestrator') {
                    mainFrame.src = 'demo-orchestrator.html';
                } else {
                    const viewMap = {
                        'dodecahedron': 'pages/dodecahedron-3d.html',
                        'calculations': 'index.html',
                        'breath': 'pages/breath-analysis.html',
                        'dna': 'pages/octave-dna.html',
                        'simulator': 'pages/simulator.html'
                    };

                    if (viewMap[view]) {
                        mainFrame.src = viewMap[view];
                    } else {
                        hideFrameLoading();
                    }
                }
            }
        });

        // Handle "Return to Welcome" logic
        function returnToWelcome() {
            Logger.info('Demo', 'Returning to orchestrator...');
            showFrameLoading();
            mainFrame.src = 'demo-orchestrator.html';
        }

        // Expose for debugging
        window.returnToWelcome = returnToWelcome;
    </script>
</body>

</html>
